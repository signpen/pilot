name: Release Promotion

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  find-ready-issues:
    runs-on: ubuntu-latest

    steps:
      - name: List ready-for-release issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "ready-for-release",
                per_page: 100
              }
            );

            core.info(`ready-for-release issue count: ${issues.length}`);

            for (const issue of issues) {
              core.info(`ISSUE #${issue.number} ${issue.title}`);
            }
