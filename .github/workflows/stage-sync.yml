name: Stage Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  find-ready-issues:
    runs-on: ubuntu-latest

    steps:
      - name: List ready-for-stage issues and find merged PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "ready-for-stage",
                per_page: 100
              }
            );

            core.info(`ready-for-stage issue count: ${issues.length}`);

            for (const issue of issues) {
              core.info(`ISSUE #${issue.number} ${issue.title}`);

              const prs = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: "closed",
                  base: "develop",
                  per_page: 100
                }
              );

              const merged = prs.filter(pr =>
                pr.merged_at &&
                pr.title.includes(`[#${issue.number}]`)
              );

              core.info(`matched merged PR count for issue #${issue.number}: ${merged.length}`);

              for (const pr of merged) {
                core.info(`PR #${pr.number} ${pr.title}`);
              }
            }
