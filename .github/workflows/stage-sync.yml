name: Stage Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  sync-stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0

      - name: Fetch all branches
        run: |
          git fetch origin +refs/heads/*:refs/remotes/origin/*

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Build sync plan
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;

            const manifestPath = ".ops/stage-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const stagedPrs = manifest.staged_prs || [];

            core.info(`already staged PRs: ${JSON.stringify(stagedPrs)}`);

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "ready-for-stage",
                per_page: 100
              }
            );

            core.info(`ready-for-stage issue count:${issues.length}`);

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "closed",
                base: "develop",
                per_page: 100
              }
            );

            const plan = [];

            for (const issue of issues) {
              core.info(`ISSUE #${issue.number} ${issue.title}`);

              const merged = prs.filter(pr =>
                pr.merged_at &&
                pr.title.includes(`[#${issue.number}]`)
              );

              const unstaged = merged.filter(pr => !stagedPrs.includes(pr.number));

              core.info(`unstaged PR count for issue #${issue.number}: ${unstaged.length}`);

              for (const pr of unstaged) {
                core.info(`UNSTAGED PR #${pr.number} ${pr.title} / merge_commit_sha=${pr.merge_commit_sha}`);
                plan.push({
                  issue_number: issue.number,
                  pr_number: pr.number,
                  pr_title: pr.title,
                  merge_commit_sha: pr.merge_commit_sha
                });
              }
            }

            core.setOutput("plan", JSON.stringify(plan));

      - name: Apply sync plan to stage
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          plan = json.loads(os.environ["PLAN_JSON"] or "[]")
          print(f"sync plan length: {len(plan)}")

          if not plan:
              print("nothing to sync")
              raise SystemExit(0)

          manifest_path = Path(".ops/stage-manifest.json")
          manifest = json.loads(manifest_path.read_text())
          staged_prs = manifest.get("staged_prs", [])

          for item in plan:
              sha = item["merge_commit_sha"]
              pr_number = item["pr_number"]
              title = item["pr_title"]

              print(f"Cherry-picking PR #{pr_number}: {title} ({sha})")
              subprocess.run(["git", "cherry-pick", sha], check=True)

              if pr_number not in staged_prs:
                  staged_prs.append(pr_number)

          manifest["staged_prs"] = staged_prs
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit and push stage changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .ops/stage-manifest.json app.txt
          git commit -m "stage sync from develop" 
          git push origin HEAD:stage

      - name: Show stage status
        run: |
          echo "----- app.txt -----"
          cat app.txt
          echo "----- manifest -----"
          cat .ops/stage-manifest.json

      - name: Update issue labels after successful sync
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "ready-for-stage",
                per_page: 100
              }
            );

            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(".ops/stage-manifest.json", "utf8"));
            const stagedPrs = manifest.staged_prs || [];

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "closed",
                base: "develop",
                per_page: 100
              }
            );

            for (const issue of issues) {
              const merged = prs.filter(pr =>
                pr.merged_at && pr.title.includes(`[#${issue.number}]`)
              );

              const allStaged = merged.length > 0 && merged.every(pr => stagedPrs.includes(pr.number));

              core.info(`Issue #${issue.number} all staged: ${allStaged}`);

              if (!allStaged) continue;

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: "ready-for-stage"
                });
              } catch (error) {
                core.info(`ready-for-stage label was not present on issue #${issue.number}`);
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ["staged"]
              });
            }
